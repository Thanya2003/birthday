<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>A Surprise For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1026;--bg2:#2A1B4D;--gold:#F5C451;--pink:#FF7EB3;--purple:#9B6BFF;--blue:#4FC3F7;--text:#FFF8EC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--text);font-family:Poppins,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.script{font-family:'Great Vibes',cursive;font-weight:400;color:var(--gold);text-shadow:0 0 18px rgba(245,196,81,.45)}
h1.script{font-size:clamp(40px,11vw,84px);line-height:1.05}
h2.script{font-size:clamp(30px,8vw,54px);line-height:1.15}
.lead{font-size:clamp(14px,3.8vw,18px);opacity:.9;margin:8px 0;min-height:1.5em}
.hand{font-family:Caveat,cursive}

/* ---------- global chrome ---------- */
#stage{position:fixed;inset:0}
.page{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:58px 16px 88px;overflow:hidden;text-align:center}
.page.on{display:flex}
.a1{background:radial-gradient(ellipse at 50% 30%,#1a2150 0,#0B1026 70%)}
.a2{background:linear-gradient(160deg,#2A1B4D,#5b2a6e 60%,#8a3a72)}
.a3{background:linear-gradient(160deg,#1b1330,#3a2440 55%,#5a3a2e)}
.a4{background:radial-gradient(ellipse at 50% 40%,#2a1d0a 0,#07060d 72%)}
#p2{background:#000}
#p3{background:linear-gradient(180deg,#0B1026,#2A1B4D)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;padding:0 0 6px;pointer-events:none}
#bar{height:4px;background:rgba(255,255,255,.1)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d99a1e,var(--gold));box-shadow:0 0 10px var(--gold);transition:width .6s}
#plabel{display:inline-block;margin:8px 14px;font-size:12px;letter-spacing:.08em;color:var(--gold);opacity:.85;pointer-events:auto;padding:6px 0}
#mute{position:fixed;top:10px;right:10px;z-index:51;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(245,196,81,.5);font-size:20px;color:var(--gold)}
#mute.off{opacity:.45;text-decoration:line-through}
.btn{min-height:48px;padding:12px 28px;border-radius:999px;background:linear-gradient(180deg,#ffe08a,#e0a52c);color:#2a1b00;font-weight:600;font-size:16px;box-shadow:0 6px 22px rgba(245,196,81,.4);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.3);box-shadow:none;font-weight:400;font-size:14px}
.btn.pinkb{background:linear-gradient(180deg,#ff9cc6,#f0528f);color:#3a0018}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 34px rgba(245,196,81,.8)}}
#next{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .4s}
#next.show{transform:translateX(-50%);opacity:1;pointer-events:auto}
#prev{position:fixed;left:12px;bottom:20px;z-index:60;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:none}
#prev.show{display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
#sparkles{position:fixed;inset:0;pointer-events:none;z-index:40}
#sparkles i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:drift linear infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}20%,80%{opacity:.6}100%{opacity:0;transform:translate(var(--dx),-140px)}}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.frag{position:absolute;border-radius:2px;pointer-events:none;z-index:20}
.overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,2,12,.82);padding:20px}
.overlay.on{display:flex}
.frame{border:8px solid var(--gold);border-radius:10px;box-shadow:0 0 0 3px #a8741a,0 0 40px rgba(245,196,81,.7);overflow:hidden;background:#111}
.wcard{max-width:420px;width:100%;padding:26px 22px;border-radius:18px;background:linear-gradient(170deg,#fff8ec,#f7e3c0);color:#3a2440;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.wcard h3{font-size:20px;margin:10px 0 6px}
.wcard p{font-size:16px;line-height:1.55}
.wcard small{display:block;margin-top:14px;opacity:.5}

/* ---------- 1 lock ---------- */
#lockwrap{width:min(38vw,150px);margin:8px 0 14px}
#lock{width:100%;overflow:visible;filter:drop-shadow(0 0 18px rgba(245,196,81,.6))}
#l-form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#l-in{height:50px;width:min(60vw,220px);padding:0 16px;border-radius:999px;border:2px solid var(--gold);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:18px;text-align:center;outline:none;letter-spacing:.15em;user-select:text;-webkit-user-select:text;transition:border-color .2s,box-shadow .2s}
#l-in.bad{border-color:#ff4d5e;box-shadow:0 0 18px #ff4d5e}
#l-hint{color:var(--pink);font-size:14px;min-height:22px;opacity:0;transition:opacity .5s}

/* ---------- 2 countdown ---------- */
.cd-num{position:absolute;left:50%;top:50%;width:min(70vw,60vh);height:min(70vw,60vh);transform:translate(-50%,-50%);display:grid;place-items:center}
.cd-num svg{position:absolute;inset:0;width:100%;height:100%}
.cd-num span{font-size:min(44vw,38vh);font-weight:700;line-height:1;text-shadow:0 0 40px currentColor,0 0 90px currentColor}
.rocket{position:absolute;bottom:0;width:6px;height:26px;border-radius:3px;background:linear-gradient(#fff,var(--gold));box-shadow:0 0 14px var(--gold)}

/* ---------- 3 name ---------- */
#nm{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hb{position:absolute;left:50%;top:58%;width:min(92vw,620px);transform:translateX(-50%);pointer-events:none;overflow:visible}
.hbt{font-family:'Great Vibes',cursive;font-size:84px;fill:transparent;stroke:var(--gold);stroke-width:1.3;stroke-dasharray:1400;stroke-dashoffset:1400}
.tip{position:absolute;bottom:96px;left:0;right:0;font-size:13px;opacity:.6;pointer-events:none}

/* ---------- 4 gift ---------- */
#g-area{position:relative;width:min(86vw,360px);height:min(56vh,420px)}
#g-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(245,196,81,.28) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);opacity:0;animation:spin 30s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#g-photo{position:absolute;left:50%;top:6%;width:min(62vw,250px);aspect-ratio:4/5;margin-left:calc(min(62vw,250px)/-2);opacity:0;z-index:3}
#gift{position:absolute;left:50%;bottom:8%;width:170px;margin-left:-85px;cursor:pointer;z-index:2}
.gbox{position:relative;height:130px;border-radius:0 0 10px 10px;background:linear-gradient(90deg,#4b2a8a,#6a3fc0 55%,#3b1f70);box-shadow:0 24px 30px rgba(0,0,0,.45)}
.glid{position:relative;height:38px;margin:0 -10px;border-radius:8px;background:linear-gradient(90deg,#5a34a4,#8052dc 55%,#472a86);box-shadow:0 5px 10px rgba(0,0,0,.35);z-index:2}
.rb{position:absolute;left:50%;top:0;bottom:0;width:30px;margin-left:-15px;background:linear-gradient(90deg,#d99a1e,#ffe08a,#d99a1e)}
.bow{position:absolute;left:50%;top:-34px;width:0;height:0}
.bow b{position:absolute;top:0;width:52px;height:36px;border:9px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:rgba(245,196,81,.15)}
.bow b:first-child{right:0;transform-origin:100% 100%;transform:rotate(-18deg)}
.bow b:last-child{left:0;transform-origin:0 100%;transform:rotate(18deg)}
#g-cap{opacity:0}

/* ---------- 5 balloons ---------- */
#b-head{position:absolute;top:50px;left:0;right:0;z-index:5;pointer-events:none}
#b-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;min-height:44px;padding:0 12px}
.chip{width:40px;height:40px;border-radius:8px;border:2px solid var(--gold);overflow:hidden;display:grid;place-items:center;font-size:20px;background:rgba(0,0,0,.3)}
.bal{position:absolute;left:0;top:0;width:76px;cursor:pointer;touch-action:manipulation;will-change:transform}
.bal-b{position:relative;width:76px;height:94px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0,rgba(255,255,255,.15) 16%,transparent 32%),radial-gradient(circle at 60% 70%,rgba(0,0,0,.25),transparent 60%),var(--c);box-shadow:inset -6px -10px 18px rgba(0,0,0,.18);display:grid;place-items:center;font-weight:700;color:#3a2400}
.bal-b::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:10px solid var(--c);border-top:0}
.bal svg{display:block;width:20px;height:70px;margin:6px auto 0}
.bal.giant{width:190px;z-index:6}
.bal.giant .bal-b{width:190px;height:234px;font-size:48px}
.pcard{position:absolute;width:150px;height:180px;border-radius:12px;border:4px solid var(--gold);background:#fff8ec;color:#3a2440;overflow:hidden;z-index:8;display:grid;place-items:center;padding:0;box-shadow:0 12px 30px rgba(0,0,0,.5);pointer-events:none}
.pcard p{padding:12px;font-family:Caveat,cursive;font-size:24px;line-height:1.15}

/* ---------- 6 memory ---------- */
#mm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,76vh,560px);perspective:1000px}
@media (max-width:600px){#mm{grid-template-columns:repeat(3,1fr);width:min(92vw,48vh)}}
.mc{aspect-ratio:1;cursor:pointer}
.mc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.mc.flip .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc-back{background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.5) 1px,transparent 2px) 0 0/16px 16px,linear-gradient(135deg,#ffe08a,#c98a14);display:grid;place-items:center;font-size:30px;color:#fff8ec;border:2px solid #fff3;text-shadow:0 2px 6px #8a5a00}
.mc-front{transform:rotateY(180deg);border:3px solid var(--gold);background:#111}
.mc.ok .mc-front{box-shadow:0 0 22px var(--gold),0 0 6px #fff}
#mm-win{display:none;flex-direction:column;align-items:center;gap:12px}
#mm-win .frame{width:min(70vw,300px);aspect-ratio:1}

/* ---------- 7 wheel ---------- */
#wheelbox{position:relative;width:min(84vw,50vh,420px);aspect-ratio:1;border-radius:50%;padding:5%;background:#1c1038;border:3px solid var(--gold);box-shadow:0 0 40px rgba(245,196,81,.35)}
#wheel{width:100%;height:100%;display:block;border-radius:50%}
#wheel text{font:600 15px Poppins,sans-serif;fill:#22123f}
.bulb{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff3c4;animation:blink .9s steps(1) infinite}
@keyframes blink{0%{background:#fff;box-shadow:0 0 10px 3px var(--gold)}34%{background:#6b5a2a;box-shadow:none}}
#w-ptr{position:absolute;left:50%;top:-14px;margin-left:-14px;border:14px solid transparent;border-top:30px solid var(--pink);border-bottom:0;transform-origin:50% 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:3}
#w-hub{position:absolute;left:50%;top:50%;width:18%;height:18%;margin:-9% 0 0 -9%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#c98a14);border:3px solid #fff8ec}
.coupon{max-width:340px;width:100%;padding:20px;border-radius:14px;border:3px dashed #c98a14;background:#fff8ec;color:#3a2440}
.coupon .cimg{width:110px;height:110px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:4px solid var(--gold)}
.coupon b{display:block;font-size:26px;color:#c0397a;margin:4px 0}

/* ---------- 8 timeline ---------- */
#p8.on{display:block;overflow-y:auto;overflow-x:hidden;padding:70px 0 140px;-webkit-overflow-scrolling:touch}
.tl-head{margin-bottom:30px}
.tl-head p{animation:bob 1.2s ease-in-out infinite;opacity:.8;margin-top:8px}
@keyframes bob{50%{transform:translateY(8px)}}
.tl{position:relative;width:min(94vw,780px);margin:0 auto;padding:20px 0 60px}
.tl-line{position:absolute;z-index:2;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.1)}
.tl-line i{display:block;width:100%;height:0;border-radius:2px;background:linear-gradient(#ffe08a,#e0a52c);box-shadow:0 0 14px var(--gold)}
.tl-heart{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);color:var(--pink);font-size:26px;text-shadow:0 0 12px var(--pink)}
.tl-item{position:relative;width:50%;padding:18px 34px}
.tl-item.R{margin-left:50%}
.tl-dot{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px 4px rgba(245,196,81,.7);transform:scale(0);transition:transform .4s cubic-bezier(.2,2,.4,1)}
.L .tl-dot{right:-9px}.R .tl-dot{left:-9px}
.pol{background:#fff;color:#333;padding:10px 10px 14px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.5);opacity:0;transform:translateX(var(--from));transition:transform .75s cubic-bezier(.2,1.5,.4,1),opacity .4s;max-width:280px}
.L .pol{--from:-120%;margin-left:auto}.R .pol{--from:120%}
.pol .ph{aspect-ratio:1;overflow:hidden;background:#ddd}
.pol b{display:block;margin-top:10px;font-size:12px;letter-spacing:.08em;color:#b07a10;min-height:16px}
.pol p{font-family:Caveat,cursive;font-size:22px;line-height:1.1;min-height:26px}
.tl-item.show .tl-dot{transform:scale(1)}
.tl-item.show .pol{opacity:1;transform:translateX(0) rotate(var(--r))}
.tl-end{opacity:0;transition:opacity 1.2s;padding:10px 16px}
.tl-end.show{opacity:1}
.tl-end svg{width:150px;margin-top:10px;overflow:visible;filter:drop-shadow(0 0 10px var(--gold))}
.tl-end path{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:62 6;animation:dash 2.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-68}}
@media (max-width:640px){
 .tl-line{left:22px}
 .tl-item,.tl-item.R{width:100%;margin-left:0;padding:16px 14px 16px 52px}
 .L .tl-dot,.R .tl-dot{left:13px;right:auto}
 .L .pol,.R .pol{--from:120%;margin-left:0}
}

/* ---------- 9 carousel ---------- */
#car{--w:min(27vw,150px);--R:calc(var(--w)*1.4);width:100%;height:min(52vh,420px);display:grid;place-items:center;perspective:1000px;touch-action:none;cursor:grab}
#ring{position:relative;width:var(--w);height:calc(var(--w)*1.3);transform-style:preserve-3d}
.ci{position:absolute;inset:0;transform-style:preserve-3d}
.ci-in{width:100%;height:100%;border-radius:10px;overflow:hidden;border:3px solid var(--gold);background:#111;-webkit-box-reflect:below 8px linear-gradient(transparent 55%,rgba(0,0,0,.35))}
#lb{cursor:pointer}
#lb div{width:min(86vw,60vh);aspect-ratio:1}

/* ---------- 10 jar ---------- */
#jar{position:relative;width:180px;height:240px;cursor:pointer;z-index:3;filter:drop-shadow(0 0 26px rgba(245,196,81,.45))}
#jar svg{width:100%;height:100%;overflow:visible}
.fly{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 3px #ffe95c;animation:ff ease-in-out infinite alternate,glow ease-in-out infinite}
@keyframes ff{to{transform:translate(var(--fx),var(--fy))}}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:1}}
.jnote{position:absolute;width:26px;height:20px;border-radius:3px;z-index:9;pointer-events:none}
.rcard{position:absolute;left:50%;top:44%;width:min(82vw,330px);min-height:170px;padding:26px 20px;border-radius:6px;z-index:10;color:#3a2440;font-family:Caveat,cursive;font-size:30px;line-height:1.15;display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.5);cursor:pointer}
.pinned{position:absolute;width:34px;height:34px;border-radius:3px;z-index:1;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.pinned::before{content:"";position:absolute;top:-4px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:50%;background:#e23b4e;box-shadow:0 1px 2px #000}

/* ---------- 11 voice ---------- */
#vinyl{position:relative;width:min(62vw,36vh,260px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);box-shadow:0 0 0 4px #000,0 18px 40px rgba(0,0,0,.6),0 0 40px rgba(245,196,81,.25);animation:spin 4s linear infinite paused;margin:10px 0}
#vinyl.playing{animation-play-state:running}
#vinyl .label{position:absolute;inset:30%;border-radius:50%;overflow:hidden;border:3px solid var(--gold)}
#vinyl::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#0b0b0b;border:1px solid var(--gold)}
#wave{display:flex;align-items:center;gap:4px;height:46px}
#wave i{width:5px;height:6px;border-radius:3px;background:var(--gold)}
#wave.playing i{animation:bar ease-in-out infinite alternate}
@keyframes bar{to{height:var(--h)}}
#sub{font-size:clamp(26px,7vw,40px);min-height:2.4em;max-width:640px;display:grid;place-items:center}

/* ---------- 12 cake ---------- */
#cake{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.candles{display:flex;gap:2px;margin-bottom:-2px;z-index:2}
.candle{position:relative;width:34px;height:96px;cursor:pointer}
.candle::after{content:"";position:absolute;left:50%;bottom:0;width:10px;height:44px;margin-left:-5px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff8ec 0 6px,var(--pink) 6px 12px)}
.flame{position:absolute;left:50%;bottom:46px;width:16px;height:26px;margin-left:-8px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 75%,#fff 0,#ffd86b 35%,#ff8a2a 75%);box-shadow:0 0 18px 6px rgba(255,170,60,.7);transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;opacity:0}
@keyframes flick{to{transform:scale(1.08,.92) rotate(-4deg)}}
.smoke{position:absolute;left:50%;bottom:50px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(220,220,220,.6);filter:blur(3px);pointer-events:none}
.tier{position:relative;border-radius:10px 10px 4px 4px;box-shadow:inset -14px 0 20px rgba(0,0,0,.18)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;border-radius:10px 10px 0 0;background:radial-gradient(circle at 50% 0,#fff8ec 68%,transparent 70%) 0 0/22px 20px repeat-x}
.t3{width:120px;height:52px;background:#ff9cc6}
.t2{width:186px;height:62px;background:#b48cff}
.t1{width:250px;height:72px;background:#ff7eb3}
.plate{width:290px;height:12px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#fff8ec,#cdbfa6)}
#ck-dark{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}

/* ---------- 13 lanterns ---------- */
#p13 h2,#p13 .lead{position:relative;z-index:3;pointer-events:none}
#p13{justify-content:flex-start}
#lans{position:absolute;inset:0;overflow:hidden}
.lan{position:absolute;top:0;width:58px;height:74px;margin-left:-29px;border-radius:40% 40% 30% 30%/30% 30% 20% 20%;background:radial-gradient(circle at 50% 75%,#fff3b0 0,#ffb347 45%,#e0652a 100%);box-shadow:0 0 30px 8px rgba(255,170,70,.55);color:#5a2400;font-weight:700;font-size:20px;animation:rise linear infinite;transform:translateY(110vh)}
.lan::after{content:"";position:absolute;left:25%;right:25%;bottom:-7px;height:8px;background:#7a3a12;border-radius:0 0 4px 4px}
.lan.seen{filter:saturate(.5) brightness(.75)}
@keyframes rise{from{transform:translateY(110vh) scale(var(--s))}to{transform:translateY(-30vh) scale(var(--s))}}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:26px;font-weight:700}

/* ---------- 14 letter ---------- */
#env{position:relative;width:min(80vw,320px);aspect-ratio:3/2;perspective:900px;margin-top:20px}
.env-body{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,#f7e8c8,#e2c998);box-shadow:0 20px 40px rgba(0,0,0,.5);overflow:hidden}
.env-body::before,.env-body::after{content:"";position:absolute;bottom:0;width:72%;height:100%;background:rgba(160,120,60,.14)}
.env-body::before{left:0;clip-path:polygon(0 0,100% 62%,0 100%)}
.env-body::after{right:0;clip-path:polygon(100% 0,0 62%,100% 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#e8d2a2,#d9bd84);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:2}
#seal{position:absolute;left:50%;top:60%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;padding:6px;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.25) 0);z-index:3;touch-action:none}
#seal span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8505f,#8f1424);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.5);font-family:'Great Vibes',cursive;font-size:34px;color:#ffd9a0}
#letter{position:absolute;left:50%;top:50%;width:min(90vw,520px);max-height:72vh;transform:translate(-50%,-50%);overflow-y:auto;padding:28px 24px;border-radius:6px;background:linear-gradient(170deg,#fffaf0,#f5e6c8);color:#3a2a1a;text-align:left;font-family:Caveat,cursive;font-size:clamp(21px,5.4vw,26px);line-height:1.35;box-shadow:0 24px 60px rgba(0,0,0,.6);display:none}
#letter p{margin-bottom:12px;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
#letter p.in{opacity:1;transform:none}

/* ---------- 15 finale ---------- */
.shimmer{background:linear-gradient(100deg,#d99a1e 20%,#fff6d0 45%,#F5C451 55%,#d99a1e 80%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:shim 3s linear infinite;filter:drop-shadow(0 0 14px rgba(245,196,81,.5));padding:0 .15em}
@keyframes shim{to{background-position:-250% 0}}
#heart{position:relative;width:min(84vw,46vh);aspect-ratio:1;margin:6px 0}
.ht{position:absolute;width:15%;aspect-ratio:1;margin:-7.5% 0 0 -7.5%;border-radius:8px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 12px rgba(245,196,81,.5)}
#fin-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;opacity:0;position:relative;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <section class="page a1" id="p1"></section>
  <section class="page a1" id="p2"></section>
  <section class="page a1" id="p3"></section>
  <section class="page a2" id="p4"></section>
  <section class="page a2" id="p5"></section>
  <section class="page a2" id="p6"></section>
  <section class="page a2" id="p7"></section>
  <section class="page a3" id="p8"></section>
  <section class="page a3" id="p9"></section>
  <section class="page a3" id="p10"></section>
  <section class="page a3" id="p11"></section>
  <section class="page a4" id="p12"></section>
  <section class="page a4" id="p13"></section>
  <section class="page a4" id="p14"></section>
  <section class="page a4" id="p15"></section>
</div>
<div id="sparkles"></div>
<div id="topbar"><div id="bar"><i></i></div><span id="plabel"></span></div>
<button id="mute" aria-label="Mute">♪</button>
<button id="prev" aria-label="Back">‹</button>
<button id="next" class="btn">Next →</button>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script>
/* =====================================================================
   EDIT THIS SECTION — everything personal lives here.
   Photos: put files in the "photos" folder named photo1.jpg ... photo22.jpg
     photo1      gift box reveal (his best photo)
     photo2-5    inside the balloons
     photo2-7    memory match pairs
     photo6      memory match win photo
     photo7      on the wheel coupon
     photo8-13   timeline (in date order, match MEMORIES below)
     photo14-21  3D carousel
     photo22     label on the vinyl record
   Audio: audio/music.mp3 (background song), audio/voice.mp3 (your message)
   Testing: tap "Surprise x of 15" five times to unlock Next/Back on every
   page, or open index.html#page=7 to jump straight to a page.
   ===================================================================== */
const CONFIG = {
  HIS_NAME: 'Bhargav',
  PASSWORD: '0000',                       // e.g. his birthday as DDMM, or a nickname
  HINT: 'Hint: the day you were born (DDMM)',
  PHOTO_DIR: 'photos/', PHOTO_EXT: '.jpg',
  MUSIC_SRC: 'audio/music.mp3',
  VOICE_SRC: 'audio/voice.mp3',
  CANDLES: 5,
  MESSAGES: [                             // inside 4 of the balloons
    'Your laugh is my favourite sound',
    'You make ordinary days feel special',
    'Still my favourite person',
    'The world is better with you in it'
  ],
  PRIZES: ['Big Hug','Movie Night','Dinner Date','Breakfast in Bed','Your Real Gift','Massage','Wish Granted','Surprise Trip'],
  WINNING_INDEX: 4,                       // 0-7, or -1 for a truly random spin
  MEMORIES: [                             // photo8 ... photo13
    {date:'DATE 1', text:'The day we first met'},
    {date:'DATE 2', text:'Our first trip together'},
    {date:'DATE 3', text:'That time we could not stop laughing'},
    {date:'DATE 4', text:'A day I will never forget'},
    {date:'DATE 5', text:'Just us, being us'},
    {date:'DATE 6', text:'My favourite memory so far'}
  ],
  REASONS: [
    'Your smile fixes my worst days','You listen, really listen','You are kinder than you know',
    'You make me laugh until it hurts','You never give up','You remember the little things',
    'You make everyone feel welcome','Your hugs feel like home','You work so hard for your dreams',
    'You are brave, even when scared','You always share your food (mostly)','You believe in me',
    'Your terrible jokes are the best','You are honest, always','You make boring errands fun',
    'You are patient with me','Your voice calms me down','You dance like nobody is watching',
    'You care so deeply','You are my safe place','You keep your promises',
    'You are curious about everything','You make plans happen','You are gentle with people',
    'You forgive easily','You look amazing, every day','You inspire me to be better',
    'You say sorry first','You are one of a kind','You are simply YOU'
  ],
  VOICE_LINES: [                          // subtitles shown while your voice plays
    'Hey you...', 'Happy birthday.', 'I made all of this just for you,',
    'because you deserve every bit of it.', 'Now keep going. There is more.'
  ],
  WISHES: [                               // one lantern each
    {from:'Mom',  text:'Happy birthday, my dear! So proud of you.'},
    {from:'Dad',  text:'Many happy returns of the day, champ.'},
    {from:'Best Friend', text:'Another year older, still not wiser. Love you, man!'},
    {from:'Sister', text:'Happy birthday to my favourite person to annoy.'},
    {from:'Friend 1', text:'Have the best day ever!'},
    {from:'Friend 2', text:'Wishing you all the happiness in the world.'},
    {from:'Friend 3', text:'Cheers to you and to many more years!'},
    {from:'Friend 4', text:'Party hard, birthday boy!'}
  ],
  LETTER: [
    'My dearest Bhargav,',
    'Happy birthday. I wanted to give you something you could not buy, so I built you this.',
    'Every page you just opened is a small piece of how I see you: playful, warm, and impossible not to love.',
    'Thank you for every laugh, every late talk and every ordinary day you made special.',
    'I hope this year gives you everything you have been quietly wishing for.',
    'Forever yours,',
    'Thanya'
  ],
  FINAL_SURPRISE: 'Be ready at 7 pm tonight. Wear something nice. The rest is a secret.'
};
/* ================= end of the section you need to edit ================= */

addEventListener('error', e => { document.documentElement.dataset.err = (document.documentElement.dataset.err||'') + e.message + ' @' + e.lineno + '; '; });
addEventListener('unhandledrejection', e => { document.documentElement.dataset.err = (document.documentElement.dataset.err||'') + 'promise: ' + (e.reason && e.reason.message || e.reason) + '; '; });

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COLORS = ['#F5C451', '#FF7EB3', '#9B6BFF', '#4FC3F7', '#FFF8EC'];
const TOTAL = 15;

/* ---------- photos (falls back to a labelled placeholder) ---------- */
function placeholder(n) {
  const h = [45, 330, 265, 200][n % 4];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},70%,62%)'/><stop offset='1' stop-color='hsl(${h + 40},60%,30%)'/></linearGradient></defs><rect width='600' height='600' fill='url(#g)'/><text x='300' y='300' font-family='sans-serif' font-size='70' font-weight='700' fill='white' text-anchor='middle'>PHOTO-${n}</text><text x='300' y='360' font-family='sans-serif' font-size='28' fill='white' opacity='.8' text-anchor='middle'>photo${n}${CONFIG.PHOTO_EXT}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function ph(img, n) { img.onerror = null; img.src = placeholder(n); }
const pic = n => `<img src="${CONFIG.PHOTO_DIR}photo${n}${CONFIG.PHOTO_EXT}" onerror="ph(this,${n})" alt="" draggable="false">`;

/* ---------- sound ---------- */
let AC = null, muted = false, gestured = false, music = null;
function audio() {
  if (!gestured) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .15, type = 'sine', v = .15, slide) {
  if (muted) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + d);
  g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d);
}
const sfx = {
  tick: () => tone(900, .06, 'square', .07),
  pop: () => tone(520, .13, 'triangle', .28, 70),
  boom: () => tone(130, .9, 'sawtooth', .32, 30),
  click: () => tone(320, .08, 'square', .12),
  buzz: () => tone(140, .25, 'sawtooth', .12),
  ding: () => { tone(880, .3, 'sine', .15); setTimeout(() => tone(1320, .5, 'sine', .15), 120); },
  chime: () => [1318, 1568, 2093].forEach((f, i) => setTimeout(() => tone(f, 1.2, 'sine', .08), i * 140))
};
const MUSIC_VOL = .45;
function startMusic() {
  if (music || !window.Howl) return;
  music = new Howl({ src: [CONFIG.MUSIC_SRC], loop: true, volume: MUSIC_VOL, html5: true });
  music.play();
}
function musicVol(v, ms = 600) { if (music) music.fade(music.volume(), v, ms); }
addEventListener('pointerdown', () => { gestured = true; if (cur > 1) startMusic(); }, true);
$('#mute').onclick = () => { muted = !muted; $('#mute').classList.toggle('off', muted); if (window.Howler) Howler.mute(muted); };

/* ---------- shared effects ---------- */
const conf = o => window.confetti && confetti(Object.assign({ colors: COLORS }, o));
function flash(ms = 200) { gsap.fromTo('#flash', { opacity: 1 }, { opacity: 0, duration: ms / 1000 + .3 }); }
function burst(root, x, y, n, colors, dist = 160, size = 8) {
  for (let i = 0; i < n; i++) {
    const f = el('i', 'frag');
    f.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${colors[i % colors.length]}`;
    root.append(f);
    const a = Math.random() * 6.283, d = rand(dist * .3, dist);
    gsap.to(f, { x: Math.cos(a) * d, y: Math.sin(a) * d, rotation: rand(-360, 360), opacity: 0, scale: rand(.2, 1), duration: rand(.6, 1.1), ease: 'power2.out', onComplete: () => f.remove() });
  }
}
function stars(box, n) {
  let h = '';
  for (let i = 0; i < n; i++) { const s = rand(1, 3); h += `<i style="left:${rand(0, 100)}%;top:${rand(0, 100)}%;width:${s}px;height:${s}px;animation-duration:${rand(2, 4)}s;animation-delay:${-rand(0, 4)}s"></i>`; }
  box.innerHTML = h;
}
function type(node, text, ms, c) {
  return new Promise(res => {
    let i = 0; node.textContent = '';
    const step = () => { node.textContent = text.slice(0, ++i); if (i < text.length) c.later(step, ms); else res(); };
    text ? step() : res();
  });
}
(function sparkles() {
  let h = '';
  for (let i = 0; i < 25; i++) h += `<i style="left:${rand(0, 100)}%;top:${rand(10, 100)}%;--dx:${rand(-40, 40)}px;animation-duration:${rand(7, 14)}s;animation-delay:${-rand(0, 14)}s"></i>`;
  $('#sparkles').innerHTML = h;
})();

/* ---------- page engine ---------- */
const pages = {};
let cur = 0, ctx = null, unlocked = false, busy = false;
function makeCtx() {
  const t = [], iv = [], offs = []; let dead = false;
  return {
    get dead() { return dead; },
    later(fn, ms) { t.push(setTimeout(() => { if (!dead) fn(); }, ms)); },
    every(fn, ms) { iv.push(setInterval(() => { if (!dead) fn(); }, ms)); },
    wait(ms) { return new Promise(res => this.later(res, ms)); },
    loop(fn) { let last = performance.now(); const step = now => { if (dead) return; fn(Math.min((now - last) / 1000, .05), now); last = now; requestAnimationFrame(step); }; requestAnimationFrame(step); },
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); offs.push(() => target.removeEventListener(ev, fn, opt)); },
    cleanup(fn) { offs.push(fn); },
    kill() { dead = true; t.forEach(clearTimeout); iv.forEach(clearInterval); offs.forEach(f => f()); }
  };
}
function showNext() { if (cur < TOTAL) $('#next').classList.add('show'); }
function hideNext() { $('#next').classList.remove('show'); }
function go(n) {
  if (busy || n < 1 || n > TOTAL) return;
  busy = true; hideNext();
  const old = cur ? $('#p' + cur) : null, neu = $('#p' + n);
  const start = () => {
    if (old) {
      ctx.kill(); gsap.killTweensOf(old.querySelectorAll('*'));
      old.classList.remove('on'); old.innerHTML = ''; gsap.set(old, { clearProps: 'all' });
    }
    cur = n;
    try { localStorage.setItem('bday-page', n); } catch (e) {}
    $('#plabel').textContent = `Surprise ${n} of ${TOTAL}`;
    $('#bar i').style.width = (n / TOTAL * 100) + '%';
    neu.classList.add('on'); neu.scrollTop = 0;
    ctx = makeCtx();
    gsap.fromTo(neu, { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .8, ease: 'power2.out', clearProps: 'transform' });
    pages[n](neu, ctx);
    busy = false;
    if (unlocked) showNext();
  };
  if (old) gsap.to(old, { opacity: 0, scale: 1.1, duration: .6, ease: 'power2.in', onComplete: start }); else start();
}
$('#next').onclick = () => { sfx.click(); go(cur + 1); };
$('#prev').onclick = () => go(cur - 1);
let taps = 0;
$('#plabel').onclick = () => { if (++taps >= 5) { unlocked = true; $('#prev').classList.add('show'); showNext(); } };

/* ================= PAGE 1: The Secret Lock ================= */
pages[1] = (root, c) => {
  root.innerHTML = `<div class="stars" style="opacity:0"></div>
    <h2 class="script" id="l-q" style="min-height:2.4em;max-width:560px"></h2>
    <div id="lockwrap"><svg id="lock" viewBox="0 0 120 150">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#D99A1E"/></linearGradient></defs>
      <path id="shackle" d="M30 70 V45 a30 30 0 0 1 60 0 V70" fill="none" stroke="#F5C451" stroke-width="12" stroke-linecap="round"/>
      <rect x="12" y="65" width="96" height="78" rx="14" fill="url(#lg)"/>
      <circle cx="60" cy="96" r="10" fill="#0B1026"/><rect x="56" y="98" width="8" height="24" rx="3" fill="#0B1026"/>
    </svg></div>
    <form id="l-form" style="opacity:0"><input id="l-in" type="text" autocomplete="off" autocapitalize="off" placeholder="the secret" aria-label="Password"><button class="btn">Unlock</button></form>
    <p id="l-hint"></p>`;
  const lock = $('#lock', root), wrap = $('#lockwrap', root), input = $('#l-in', root), form = $('#l-form', root), hint = $('#l-hint', root);
  stars($('.stars', root), 120);
  gsap.to($('.stars', root), { opacity: 1, duration: 1.5, delay: .5 });
  gsap.fromTo(wrap, { y: -innerHeight, opacity: 1 }, { y: 0, duration: 1.2, delay: 1.5, ease: 'bounce.out' });
  gsap.set(wrap, { y: -innerHeight });
  let pulse;
  c.later(() => { sfx.chime(); pulse = gsap.to(lock, { scale: 1.05, transformOrigin: '50% 50%', duration: .75, yoyo: true, repeat: -1, ease: 'sine.inOut' }); }, 2800);
  c.later(() => { type($('#l-q', root), 'Only one person in the world can open this...', 40, c); gsap.to(form, { opacity: 1, duration: .8, delay: 1 }); }, 3200);
  let done = false;
  form.onsubmit = e => {
    e.preventDefault(); if (done) return;
    if (input.value.trim().toLowerCase() !== String(CONFIG.PASSWORD).toLowerCase()) {
      sfx.buzz();
      gsap.fromTo(wrap, { x: 0 }, { keyframes: { x: [0, -14, 14, -14, 14, -10, 10, -6, 6, 0] }, duration: .4, ease: 'none' });
      input.classList.add('bad'); c.later(() => input.classList.remove('bad'), 600);
      hint.textContent = CONFIG.HINT; hint.style.opacity = 1; input.select();
      return;
    }
    done = true; input.blur(); sfx.click(); startMusic();
    if (pulse) pulse.kill();
    gsap.to($('#shackle', root), { rotation: 30, y: -8, svgOrigin: '90 70', duration: .35, ease: 'back.out(3)' });
    c.later(() => {
      const r = lock.getBoundingClientRect();
      lock.style.visibility = 'hidden'; form.style.visibility = 'hidden';
      burst(root, r.left + r.width / 2, r.top + r.height / 2, 80, ['#F5C451', '#FFE08A', '#fff'], Math.max(innerWidth, innerHeight) * .6, 9);
      flash(200); sfx.ding();
    }, 500);
    c.later(() => go(2), 1400);
  };
};

/* ================= PAGE 2: The Countdown ================= */
pages[2] = async (root, c) => {
  root.innerHTML = `<div id="cd"></div>
    <div id="cd-end" style="opacity:0;display:flex;flex-direction:column;align-items:center;gap:26px">
      <h1 class="script">Get ready...<br>tonight is all about YOU</h1>
      <button class="btn pulse">Tap to begin</button></div>`;
  const st = $('#cd', root), cols = ['#F5C451', '#FF7EB3', '#9B6BFF', '#4FC3F7', '#FFFFFF'];
  $('button', root).onclick = () => go(3);
  await c.wait(900);
  for (let k = 0; k < 5; k++) {
    const col = cols[k], w = el('div', 'cd-num');
    w.style.color = col;
    w.innerHTML = `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="591" stroke-dashoffset="591" transform="rotate(-90 100 100)"/></svg><span>${5 - k}</span>`;
    st.append(w); sfx.tick();
    gsap.fromTo($('span', w), { scale: .1, opacity: 0 }, { scale: 1, opacity: 1, duration: .8, ease: 'power2.out' });
    gsap.to($('circle', w), { strokeDashoffset: 0, duration: 1, ease: 'none' });
    await c.wait(1000);
    w.remove();
    burst(root, innerWidth / 2, innerHeight / 2, 20, [col], Math.min(innerWidth, innerHeight) * .6, 16);
  }
  await c.wait(2000);
  flash(150); sfx.boom();
  [.25, .5, .75].forEach((x, i) => c.later(() => {
    const r = el('i', 'rocket'); r.style.left = (x * 100) + '%'; root.append(r);
    const h = rand(.5, .72);
    gsap.to(r, { y: -innerHeight * h, duration: .9, ease: 'power2.out', onComplete: () => { r.remove(); sfx.pop(); conf({ particleCount: 110, spread: 360, startVelocity: 32, origin: { x, y: 1 - h } }); } });
  }, 250 + i * 400));
  await c.wait(2200);
  gsap.to($('#cd-end', root), { opacity: 1, duration: 1.2 });
};

/* ================= PAGE 3: His Name in the Stars ================= */
pages[3] = (root, c) => {
  root.innerHTML = `<canvas id="nm"></canvas>
    <svg class="hb" viewBox="0 0 600 120"><text class="hbt" x="300" y="88" text-anchor="middle">Happy Birthday</text></svg>
    <p class="tip">Tap the stars to scatter them</p>`;
  const cv = $('#nm', root), g = cv.getContext('2d'), name = CONFIG.HIS_NAME;
  const N = clamp(name.length * 150, 700, 1500), P = [];
  let W, H, mode = 'drift', t0 = performance.now(), driftDur = 3000, shoot = null;
  for (let i = 0; i < N; i++) P.push({ x: rand(0, innerWidth), y: rand(0, innerHeight), vx: rand(-40, 40), vy: rand(-40, 40), r: rand(.8, 1.7), ph: rand(0, 6.28), c: Math.random() < .7 ? '#FFE9A8' : '#FFFFFF', tx: 0, ty: 0, sx: 0, sy: 0 });
  function target() {
    const o = document.createElement('canvas'); o.width = W; o.height = H;
    const x = o.getContext('2d', { willReadFrequently: true }), fs = Math.min(H * .24, W * 1.4 / Math.max(name.length, 3));
    x.font = `700 ${fs}px Poppins, Arial, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(name, W / 2, H * .38);
    const d = x.getImageData(0, 0, W, H).data, all = [];
    for (let y = 0; y < H; y += 3) for (let xx = 0; xx < W; xx += 3) if (d[(y * W + xx) * 4 + 3] > 128) all.push([xx, y]);
    shuffle(all);

    gsap.to(card, { scaleX: 1, duration: .3, ease: 'power2.out' });
    gsap.to(card, { scaleY: 1, duration: .35, delay: .3, ease: 'back.out(1.6)' });
    let pinned = false;
    const pin = () => {
      if (pinned) return; pinned = true;
      const top = n % 2 === 0, x = rand(8, 84), y = top ? rand(22, 30) : rand(74, 82);
      gsap.to(card, { left: x + '%', top: y + '%', scale: .1, opacity: 0, duration: .5, ease: 'power2.in', onComplete: () => {
        card.remove();
        const p = el('i', 'pinned'); p.style.cssText = `left:${x}%;top:${y}%;background:${col};transform:rotate(${rand(-18, 18)}deg)`; root.append(p);
        n++; lock = false;
        $('#j-c', root).textContent = `Reason ${n} of ${R.length}`;
        if (n >= Math.min(10, R.length)) showNext();
      } });
    };
    card.onclick = pin;
    c.later(() => type(card, R[n], 35, c).then(() => c.later(pin, 3000)), 650);
  }
};

/* ================= PAGE 11: A Message Just for You ================= */
pages[11] = (root, c) => {
  let bars = '';
  for (let i = 0; i < 24; i++) bars += `<i style="--h:${rand(12, 46)}px;animation-duration:${rand(.25, .7)}s"></i>`;
  root.innerHTML = `<h2 class="script">A message just for you</h2><p class="lead">Press play. Use headphones 🎧</p>
    <div id="vinyl"><div class="label">${pic(22)}</div></div>
    <div id="wave">${bars}</div>
    <p class="script" id="sub"></p>
    <button class="btn pulse" id="v-play">▶ Play</button>`;
  const btn = $('#v-play', root), sub = $('#sub', root), lines = CONFIG.VOICE_LINES;
  btn.onclick = () => {
    btn.style.visibility = 'hidden'; btn.classList.remove('pulse');
    $('#vinyl', root).classList.add('playing'); $('#wave', root).classList.add('playing');
    musicVol(MUSIC_VOL * .15);
    let started = false, done = false;
    const finish = () => {
      if (done) return; done = true;
      $('#vinyl', root).classList.remove('playing'); $('#wave', root).classList.remove('playing');
      musicVol(MUSIC_VOL); showNext();
    };
    const say = l => gsap.to(sub, { opacity: 0, duration: .3, onComplete: () => { sub.textContent = l; gsap.to(sub, { opacity: 1, duration: .5 }); } });
    const run = total => { const per = total / lines.length; lines.forEach((l, i) => c.later(() => say(l), i * per * 1000)); c.later(finish, total * 1000 + 400); };
    const fallback = () => { if (started) return; started = true; run(lines.length * 3.2); };
    const a = new Audio(); a.muted = muted;
    c.cleanup(() => { a.pause(); musicVol(MUSIC_VOL); });
    a.addEventListener('loadedmetadata', () => { if (started) return; started = true; a.play().catch(() => {}); run(isFinite(a.duration) && a.duration > 1 ? a.duration : lines.length * 3.2); });
    a.addEventListener('error', fallback);
    c.later(fallback, 2500);
    a.src = CONFIG.VOICE_SRC;
  };
};

/* ================= PAGE 12: Make a Wish ================= */
pages[12] = (root, c) => {
  const N = clamp(CONFIG.CANDLES | 0, 1, 7);
  root.innerHTML = `<div id="ck-dark"></div><h2 class="script" id="ck-t" style="position:relative;z-index:5">Make a wish...</h2>
    <div id="cake"><div class="candles">${'<div class="candle"><i class="flame"></i></div>'.repeat(N)}</div>
      <div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div></div>
    <p class="lead" id="ck-l">&nbsp;</p>
    <button class="btn ghost" id="ck-mic" style="visibility:hidden">🎤 Or blow on your phone</button>`;
  const candles = $$('.candle', root), lead = $('#ck-l', root), mic = $('#ck-mic', root);
  ['.plate', '.t1', '.t2', '.t3'].forEach((s, i) => gsap.from($(s, root), { y: -innerHeight, duration: .9, delay: .3 + i * .5, ease: 'bounce.out' }));
  gsap.from($('.candles', root), { scale: 0, transformOrigin: '50% 100%', duration: .5, delay: 2.5, ease: 'back.out(2)' });
  candles.forEach((cd, i) => gsap.to($('.flame', cd), { opacity: 1, duration: .3, delay: 3.1 + i * .2 }));
  let ready = false, out = 0;
  c.later(() => { ready = true; lead.textContent = 'Tap each flame to blow out the candles'; mic.style.visibility = 'visible'; }, 3200 + N * 200);
  function blow(cd) {
    if (!ready || cd.dataset.out) return; cd.dataset.out = 1; out++;
    gsap.killTweensOf($('.flame', cd)); $('.flame', cd).style.display = 'none';
    const s = el('i', 'smoke'); cd.append(s);
    gsap.to(s, { y: -60, x: rand(-14, 14), scale: 3, opacity: 0, duration: 1.4, ease: 'power1.out', onComplete: () => s.remove() });
    tone(300, .2, 'sine', .05, 120);
    if (out === N) finish();
  }
  candles.forEach(cd => cd.onclick = () => blow(cd));
  function finish() {
    mic.style.visibility = 'hidden'; lead.innerHTML = '&nbsp;';
    gsap.to($('#ck-dark', root), { opacity: .75, duration: .8, yoyo: true, repeat: 1, repeatDelay: .8 });
    c.later(() => {
      $('#ck-t', root).textContent = 'Your wish is on its way ✨'; sfx.ding();
      conf({ particleCount: 200, spread: 120, origin: { y: .4 } });
      showNext();
    }, 1700);
  }
  mic.onclick = async () => {
    mic.style.visibility = 'hidden';
    try {
      const a = audio(); if (!a) throw 0;
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      c.cleanup(() => s.getTracks().forEach(t => t.stop()));
      const an = a.createAnalyser(); an.fftSize = 512; a.createMediaStreamSource(s).connect(an);
      const buf = new Uint8Array(an.fftSize); let cool = 0;
      lead.textContent = 'Now blow! 🌬️';
      c.loop(dt => {
        if (out >= N) return;
        an.getByteTimeDomainData(buf);
        let sum = 0; for (const v of buf) { const d = (v - 128) / 128; sum += d * d; }
        cool -= dt;
        if (Math.sqrt(sum / buf.length) > .18 && cool <= 0) { cool = .35; blow(candles.find(x => !x.dataset.out)); }
      });
    } catch (e) { lead.textContent = 'No mic, just tap each flame 😊'; }
  };
};

/* ================= PAGE 13: Wishes from Everyone ================= */
pages[13] = (root, c) => {
  const W = CONFIG.WISHES, need = Math.min(5, W.length), order = shuffle(W.map((_, i) => i));
  root.innerHTML = `<div class="stars"></div><h2 class="script">Wishes from everyone</h2>
    <p class="lead" id="w-c">Tap a lantern · 0 of ${need} opened</p>
    <div id="lans">${W.map((w, i) => { const d = rand(15, 23); return `<button class="lan" data-i="${i}" style="left:${(order[i] + .5) / W.length * 84 + 8}%;--s:${rand(.85, 1.2).toFixed(2)};animation-duration:${d}s;animation-delay:${-(i / W.length) * d - rand(0, 2)}s">${w.from[0]}</button>`; }).join('')}</div>
    <div class="overlay" id="w-ov"><div class="wcard"><div class="av"></div><h3></h3><p></p><small>tap to close</small></div></div>`;
  stars($('.stars', root), 80);
  const ov = $('#w-ov', root), seen = new Set();
  $$('.lan', root).forEach(l => l.onclick = () => {
    const w = W[+l.dataset.i]; sfx.chime();
    l.classList.add('seen'); seen.add(l.dataset.i);
    $('.av', ov).textContent = w.from[0]; $('h3', ov).textContent = 'From ' + w.from; $('p', ov).textContent = w.text;
    ov.classList.add('on');
    gsap.fromTo($('.wcard', ov), { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .45, ease: 'back.out(1.6)' });
    $('#w-c', root).textContent = `Tap a lantern · ${Math.min(seen.size, need)} of ${need} opened`;
  });
  ov.onclick = () => { ov.classList.remove('on'); if (seen.size >= need) showNext(); };
};

/* ================= PAGE 14: The Letter ================= */
pages[14] = (root, c) => {
  root.innerHTML = `<p class="lead" id="lt-l">Press and hold the seal to open</p>
    <div id="env"><div class="env-body"></div><div class="env-flap"></div>
      <button id="seal" style="--p:0" aria-label="Hold to open"><span>${CONFIG.HIS_NAME[0] || '♥'}</span></button></div>
    <div id="letter"></div>`;
  const seal = $('#seal', root), letter = $('#letter', root);
  let hold = false, p = 0, opened = false;
  c.on(seal, 'pointerdown', e => { e.preventDefault(); hold = true; });
  c.on(window, 'pointerup', () => { hold = false; }); c.on(window, 'pointercancel', () => { hold = false; });
  c.on(seal, 'contextmenu', e => e.preventDefault());
  c.loop(dt => {
    if (opened) return;
    p = clamp(p + (hold ? dt * 50 : -dt * 80), 0, 100);
    seal.style.setProperty('--p', p);
    if (p >= 100) open();
  });
  function open() {
    opened = true; sfx.click(); musicVol(MUSIC_VOL * .6);
    $('#lt-l', root).innerHTML = '&nbsp;';
    gsap.to(seal, { scale: 1.5, opacity: 0, duration: .4 });
    gsap.to($('.env-flap', root), { rotationX: 180, duration: .7, delay: .3, ease: 'power2.inOut' });
    gsap.to($('#env', root), { y: 120, scale: .7, opacity: 0, duration: .7, delay: 1.1 });
    c.later(() => {
      letter.style.display = 'block';
      gsap.fromTo(letter, { xPercent: -50, yPercent: -50, scale: .3, y: 80, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: .8, ease: 'power2.out' });
      let t = 900;
      CONFIG.LETTER.forEach((line, i) => {
        c.later(() => { const el2 = el('p'); el2.textContent = line; letter.append(el2); requestAnimationFrame(() => el2.classList.add('in')); letter.scrollTo({ top: letter.scrollHeight, behavior: 'smooth' }); }, t);
        t += Math.max(1100, line.length * 55);
      });
      c.later(showNext, t + 600);
    }, 1500);
  }
  c.cleanup(() => musicVol(MUSIC_VOL));
};

/* ================= PAGE 15: Grand Finale ================= */
pages[15] = (root, c) => {
  const N = 22;
  let tiles = '';
  const hp = t => [16 * Math.pow(Math.sin(t), 3), 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
  const dense = [], len = [0];
  for (let i = 0; i <= 600; i++) { dense.push(hp(i / 600 * 6.283)); if (i) len.push(len[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1])); }
  for (let i = 0, j = 0; i < N; i++) {
    const want = (i + .5) / N * len[600]; while (len[j] < want) j++;
    const [x, y] = dense[j];
    tiles += `<div class="ht" style="left:${50 + x / 16 * 42}%;top:${(12.5 - y) / 30 * 84 + 8}%">${pic(i + 1)}</div>`;
  }
  root.innerHTML = `<h1 class="script shimmer">Happy Birthday<br>${CONFIG.HIS_NAME}</h1>
    <div id="heart">${tiles}</div>
    <div id="fin-btns"><button class="btn ghost" id="f-re">↺ Replay the journey</button><button class="btn pinkb pulse" id="f-one">One last surprise 🎁</button></div>
    <div class="overlay" id="f-ov"><div class="wcard"><h2 class="script" style="color:#c0397a;text-shadow:none">One last surprise</h2><p></p><small>tap to close</small></div></div>`;
  musicVol(.85, 1500); c.cleanup(() => musicVol(MUSIC_VOL));
  gsap.from($$('.ht', root), { x: () => rand(-innerWidth, innerWidth), y: () => rand(-innerHeight, innerHeight), scale: 0, rotation: () => rand(-360, 360), opacity: 0, duration: 1.1, stagger: .08, delay: .6, ease: 'back.out(1.2)' });
  c.later(() => gsap.to($('#heart', root), { scale: 1.05, duration: .6, yoyo: true, repeat: -1, ease: 'sine.inOut' }), 3600);
  gsap.to($('#fin-btns', root), { opacity: 1, duration: 1, delay: 4 });
  const fire = (x, y) => conf({ particleCount: 70, spread: 360, startVelocity: 26, ticks: 110, gravity: .7, scalar: .9, origin: { x, y } });
  c.later(() => { sfx.boom(); fire(.5, .4); }, 700);
  c.every(() => fire(rand(.12, .88), rand(.12, .5)), 900);
  c.on(root, 'pointerdown', e => { if (e.target.closest('button,.overlay')) return; sfx.pop(); fire(e.clientX / innerWidth, e.clientY / innerHeight); });
  const ov = $('#f-ov', root);
  $('#f-one', root).onclick = () => { $('p', ov).textContent = CONFIG.FINAL_SURPRISE; ov.classList.add('on'); gsap.fromTo($('.wcard', ov), { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(1.6)' }); sfx.ding(); };
  ov.onclick = () => ov.classList.remove('on');
  $('#f-re', root).onclick = () => { try { localStorage.removeItem('bday-page'); } catch (e) {} go(1); };
};

/* ---------- start ---------- */
(function init() {
  if (!window.gsap) { document.body.innerHTML = '<p style="padding:40px;text-align:center">Please connect to the internet and reload. The animation library could not load.</p>'; return; }
  let n = 1;
  const m = location.hash.match(/page=(\d+)/);
  try { n = m ? +m[1] : +(localStorage.getItem('bday-page') || 1); } catch (e) {}
  go(clamp(n || 1, 1, TOTAL));
})();
</script>
</body>
